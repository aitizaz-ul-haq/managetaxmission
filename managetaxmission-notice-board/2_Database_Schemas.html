</text><text x="305" y="397.71" font-family="'Patrick Hand', 'Kalam', cursive" font-size="14" fill="#23264a" text-anchor="start" font-weight="normal" opacity="1">• Seller comes from the top level</text><text x="305" y="414.51" font-family="'Patrick Hand', 'Kalam', cursive" font-size="14" fill="#23264a" text-anchor="start" font-weight="normal" opacity="1">• Buyer comes from the FIRST item row</text><text x="305" y="431.31" font-family="'Patrick Hand', 'Kalam', cursive" font-size="14" fill="#23264a" text-anchor="start" font-weight="normal" opacity="1">• Every row becomes items[]</text><rect x="399.0" y="331" width="52" height="18" fill="rgba(255,99,114,0.55)" transform="rotate(3 425.0 340)"/></g><g transform="rotate(1 697.0 455.0)"><path d="M572,414 H830 V494 L816,508 H572 Z" fill="#000" opacity="0.13"/><path d="M568,408 H826 V486 L810,502 H568 Z" fill="#CDBEFF" stroke="#a498cc" stroke-width="1"/><path d="M826,486 L810,502 L810,486 Z" fill="#a89bd1"/><text x="577" y="431.45" font-family="'Kalam', 'Patrick Hand', cursive" font-size="17" fill="#23264a" text-anchor="start" font-weight="bold" opacity="1">Item row ≈ 33 fields</text><text x="577" y="465.71" font-family="'Patrick Hand', 'Kalam', cursive" font-size="14" fill="#23264a" text-anchor="start" font-weight="normal" opacity="1">• embedded array — no _id join</text><text x="577" y="482.51" font-family="'Patrick Hand', 'Kalam', cursive" font-size="14" fill="#23264a" text-anchor="start" font-weight="normal" opacity="1">• edited as a grid in the UI</text><rect x="671.0" y="399" width="52" height="18" fill="rgba(255,99,114,0.55)" transform="rotate(-3 697.0 408)"/></g><g transform="rotate(-0.5 425.0 562.0)"><path d="M300,490 H558 V632 L544,646 H300 Z" fill="#000" opacity="0.13"/><path d="M296,484 H554 V624 L538,640 H296 Z" fill="#FFF27A" stroke="#ccc161" stroke-width="1"/><path d="M554,624 L538,640 L538,624 Z" fill="#d1c664"/><text x="308" y="511.3" font-family="'Kalam', 'Patrick Hand', cursive" font-size="18" fill="#23264a" text-anchor="start" font-weight="bold" opacity="1">Calculated on save</text><text x="308" y="547.14" font-family="'Patrick Hand', 'Kalam', cursive" font-size="14.5" fill="#23264a" text-anchor="start" font-weight="normal" opacity="1">• saleValue = qty × unitPrice</text><text x="308" y="564.54" font-family="'Patrick Hand', 'Kalam', cursive" font-size="14.5" fill="#23264a" text-anchor="start" font-weight="normal" opacity="1">• taxAmount = saleValue × taxRate /</text><text x="308" y="581.9399999999999" font-family="'Patrick Hand', 'Kalam', cursive" font-size="14.5" fill="#23264a" text-anchor="start" font-weight="normal" opacity="1">  100</text><text x="308" y="599.3399999999999" font-family="'Patrick Hand', 'Kalam', cursive" font-size="14.5" fill="#23264a" text-anchor="start" font-weight="normal" opacity="1">• totalBill = Σ saleValue + Σ</text><text x="308" y="616.7399999999999" font-family="'Patrick Hand', 'Kalam', cursive" font-size="14.5" fill="#23264a" text-anchor="start" font-weight="normal" opacity="1">  taxAmount</text><rect x="399.0" y="475" width="52" height="18" fill="rgba(255,99,114,0.55)" transform="rotate(3 425.0 484)"/></g><g transform="rotate(1 153.0 652.0)"><path d="M28,578 H286 V724 L272,738 H28 Z" fill="#000" opacity="0.13"/><path d="M24,572 H282 V716 L266,732 H24 Z" fill="#9BF0C8" stroke="#7cc0a0" stroke-width="1"/><path d="M282,716 L266,732 L266,716 Z" fill="#7fc4a4"/><text x="36" y="599.3" font-family="'Kalam', 'Patrick Hand', cursive" font-size="18" fill="#23264a" text-anchor="start" font-weight="bold" opacity="1">Status values</text><text x="36" y="635.14" font-family="'Patrick Hand', 'Kalam', cursive" font-size="14.5" fill="#23264a" text-anchor="start" font-weight="normal" opacity="1">• draft → validated</text><text x="36" y="652.54" font-family="'Patrick Hand', 'Kalam', cursive" font-size="14.5" fill="#23264a" text-anchor="start" font-weight="normal" opacity="1">• → ready_for_submission</text><text x="36" y="669.9399999999999" font-family="'Patrick Hand', 'Kalam', cursive" font-size="14.5" fill="#23264a" text-anchor="start" font-weight="normal" opacity="1">• → submitted | failed</text><rect x="127.0" y="563" width="52" height="18" fill="rgba(255,99,114,0.55)" transform="rotate(-3 153.0 572)"/></g><g transform="rotate(-1 425.0 700.0)"><path d="M300,662 H558 V736 L544,750 H300 Z" fill="#000" opacity="0.13"/><path d="M296,656 H554 V728 L538,744 H296 Z" fill="#FF9DB1" stroke="#cc7d8d" stroke-width="1"/><path d="M554,728 L538,744 L538,728 Z" fill="#d18091"/><text x="305" y="679.45" font-family="'Kalam', 'Patrick Hand', cursive" font-size="17" fill="#23264a" text-anchor="start" font-weight="bold" opacity="1">validationStatus</text><text x="305" y="714.11" font-family="'Patrick Hand', 'Kalam', cursive" font-size="14.5" fill="#23264a" text-anchor="start" font-weight="normal" opacity="1">• pending · valid · invalid</text><rect x="399.0" y="647" width="52" height="18" fill="rgba(180,186,255,0.7)" transform="rotate(3 425.0 656)"/></g><g transform="rotate(0.8 697.0 631.0)"><path d="M572,526 H830 V734 L816,748 H572 Z" fill="#000" opacity="0.13"/><path d="M568,520 H826 V726 L810,742 H568 Z" fill="#FFC078" stroke="#cc9960" stroke-width="1"/><path d="M826,726 L810,742 L810,726 Z" fill="#d19d62"/><text x="577" y="544.3" font-family="'Kalam', 'Patrick Hand', cursive" font-size="18" fill="#23264a" text-anchor="start" font-weight="bold" opacity="1">Typed carefully</text><text x="577" y="579.74" font-family="'Patrick Hand', 'Kalam', cursive" font-size="14" fill="#23264a" text-anchor="start" font-weight="normal" opacity="1">• NTN: 7 alphanumerics</text><text x="577" y="596.54" font-family="'Patrick Hand', 'Kalam', cursive" font-size="14" fill="#23264a" text-anchor="start" font-weight="normal" opacity="1">• CNIC: 13 digits</text><text x="577" y="613.3399999999999" font-family="'Patrick Hand', 'Kalam', cursive" font-size="14" fill="#23264a" text-anchor="start" font-weight="normal" opacity="1">• dates stored YYYY-MM-DD strings< 999" font-family="'Patrick Hand', 'Kalam', cursive" font-size="15" fill="#23264a" text-anchor="start" font-weight="normal" opacity="1">• Totals live beside the rows they</text><text x="852" y="643.5699999999999" font-family="'Patrick Hand', 'Kalam', cursive" font-size="15" fill="#23264a" text-anchor="start" font-weight="normal" opacity="1">  sum</text><rect x="943.0" y="461" width="52" height="18" fill="rgba(255,99,114,0.55)" transform="rotate(3 969.0 470)"/></g><text x="28" y="780" font-family="'Caveat', 'Kalam', cursive" font-size="21" font-weight="bold" fill="#4B4E6D">Manage<tspan fill="#FF6372">Tax</tspan>Mission</text><text x="561.5" y="780" text-anchor="middle" font-family="'Patrick Hand', 'Kalam', cursive" font-size="14" fill="#6a6d8c">Next.js 14 · React 18 · MongoDB · FBR Bridge · Sales Tax / FED invoicing</text><g transform="rotate(-2 1053 774)"><rect x="1003" y="758" width="96" height="26" rx="13" fill="#FFF27A" stroke="#23264a" stroke-width="1.8"/><text x="1051" y="776" text-anchor="middle" font-family="'Kalam', 'Patrick Hand', cursive" font-weight="bold" font-size="15" fill="#23264a">page 7 / 20</text></g></svg></section><section class="pg"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1123 794" width="100%" height="100%"><defs><marker id="ah-navy" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 L4,6 Z" fill="#4B4E6D"/></marker><marker id="ah-coral" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 L4,6 Z" fill="#FF6372"/></marker><marker id="ah-ink" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 L4,6 Z" fill="#23264a"/></marker><marker id="ah-green" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 L4,6 Z" fill="#1f9d63"/></marker><marker id="ah-p
